<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta
      name="description"
      content="Customer support chat and support desk for a fictional delivery app in Qatar. All data is invented."
    />
    <title>Jalboot Support</title>
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%favicon.svg" />
    <script>
      // Runs before first paint so language direction and theme never flash.
      (function () {
        var root = document.documentElement;
        function read(key) {
          try {
            return localStorage.getItem(key);
          } catch (e) {
            return null;
          }
        }
        var query = new URLSearchParams(location.search).get('lang');
        var lang = query === 'ar' || query === 'en' ? query : read('support.lang');
        if (lang !== 'ar' && lang !== 'en') {
          lang = (navigator.language || '').toLowerCase().indexOf('ar') === 0 ? 'ar' : 'en';
        }
        root.lang = lang;
        root.dir = lang === 'ar' ? 'rtl' : 'ltr';
        var theme = read('support.theme');
        if (theme === 'light' || theme === 'dark') root.dataset.theme = theme;
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
